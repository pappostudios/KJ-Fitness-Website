<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KJ Fitness - דשבורד מאמנת</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root{--primary:#00bcd4;--bg:#1a1a1a;--card:rgba(255,255,255,0.05);--border:rgba(0,188,212,0.3);}
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Heebo',sans-serif;}
    body{background:var(--bg);color:#fff;min-height:100vh;}
    header{background:rgba(0,0,0,0.9);border-bottom:2px solid var(--primary);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
    .hdr-logo{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;}
    .hdr-logo img{height:40px;}
    .hdr-logo span{font-size:1.3rem;font-weight:700;color:var(--primary);}
    .hdr-right{display:flex;align-items:center;gap:16px;}
    .welcome{font-size:.95rem;color:#ccc;}
    .logout-btn{background:transparent;border:1px solid var(--primary);color:var(--primary);padding:8px 16px;border-radius:6px;cursor:pointer;font-family:'Heebo',sans-serif;font-size:.9rem;transition:all .3s;}
    .logout-btn:hover{background:var(--primary);color:#fff;}
    .main{padding:30px 5%;max-width:1200px;margin:0 auto;}
    .tabs-nav{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap;}
    .tnav{background:var(--card);border:1px solid var(--border);color:#ccc;padding:10px 22px;border-radius:8px;cursor:pointer;font-family:'Heebo',sans-serif;font-size:1rem;font-weight:600;transition:all .3s;}
    .tnav.active{background:var(--primary);border-color:var(--primary);color:#fff;}
    .tab-content{display:none;}
    .tab-content.active{display:block;}
    h2{font-size:1.6rem;margin-bottom:22px;color:var(--primary);}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;}
    .client-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
    .client-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;}
    .client-card h4{color:var(--primary);margin-bottom:6px;}
    .client-card .useremail{font-size:.85rem;color:#aaa;margin-bottom:10px;}
    .client-card .upcoming{font-size:.85rem;color:#ccc;}
    .empty-state{text-align:center;color:#666;padding:40px;font-size:1rem;}
    .day-group{margin-bottom:22px;}
    .day-group h3{font-size:1.05rem;color:#fff;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    .session-card{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
    .session-accent{width:5px;flex-shrink:0;}
    .session-body{padding:14px 16px;flex:1;}
    .session-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
    .session-client{font-weight:700;font-size:1rem;}
    .session-meta{font-size:.85rem;color:#aaa;}
    .session-location{font-size:.8rem;color:#888;margin-top:2px;}
    .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
    .pill{border-radius:20px;padding:3px 10px;font-size:.75rem;font-weight:600;border:1px solid;}
    .type-pill{background:rgba(0,188,212,0.15);border-color:rgba(0,188,212,0.35);color:var(--primary);}
    .type-pill.group{background:rgba(139,92,246,0.15);border-color:rgba(139,92,246,0.35);color:#8B5CF6;}
    @media(max-width:600px){.main{padding:20px 4%;}}
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="hdr-logo">
      <img src="kj fitness.jpg" alt="KJ" onerror="this.style.display='none'">
      <span>KJ FITNESS - מאמנת</span>
    </a>
    <div class="hdr-right">
      <span class="welcome" id="welcomeMsg"></span>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> יציאה</button>
    </div>
  </header>

  <div class="main">
    <div class="tabs-nav">
      <button class="tnav active" onclick="showTab('schedule',event)"><i class="fas fa-calendar-alt"></i> לוח זמנים</button>
      <button class="tnav" onclick="showTab('clients',event)"><i class="fas fa-users"></i> לקוחות</button>
    </div>
    <div id="tab-schedule" class="tab-content active">
      <h2>לוח הזמנים המלא</h2>
      <p style="color:#aaa;margin-bottom:20px;font-size:.95rem;">כל האימונים המתוכננים עם כל הלקוחות/ות.</p>
      <div id="scheduleList"></div>
    </div>
    <div id="tab-clients" class="tab-content">
      <h2>לקוחות מאושרים/ות</h2>
      <div id="clientList" class="client-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, collection, query, where, orderBy, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const COACH_EMAILS = ['pappostudios@gmail.com', 'kjfitness.info@gmail.com'];
    function isCoach(email) { return COACH_EMAILS.includes(email.toLowerCase()); }

    const firebaseConfig = {
      apiKey: "AIzaSyBJDYiwXugrAaoOvoeuExHn_mMNgxN3Kpg",
      authDomain: "kj-fitness-80723.firebaseapp.com",
      projectId: "kj-fitness-80723",
      storageBucket: "kj-fitness-80723.firebasestorage.app",
      messagingSenderId: "525333297888",
      appId: "1:525333297888:web:7246851d44b70d9904ee85"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const STATUS_CONFIG = {
      pending_confirmation: { label: 'ממתין לאישור', color: '#F59E0B' },
      confirmed:            { label: 'מאושר', color: '#10B981' },
      cancelled:            { label: 'בוטל', color: '#EF4444' },
    };
    const PAYMENT_CONFIG = {
      unpaid:  { label: 'לא שולם', color: '#EF4444' },
      pending: { label: 'ממתין לתשלום', color: '#F59E0B' },
      paid:    { label: 'שולם', color: '#10B981' },
    };

    function toISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    async function getApprovedClients() {
      const q = query(
        collection(db, 'users'),
        where('role', '==', 'client'),
        where('status', '==', 'approved'),
        orderBy('name', 'asc'),
      );
      const snap = await getDocs(q);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    async function getUpcomingBookingsForClient(uid) {
      const today = toISO(new Date());
      const q = query(
        collection(db, 'bookings'),
        where('clientId', '==', uid),
        where('date', '>=', today),
      );
      const snap = await getDocs(q);
      return snap.docs.map(d => d.data()).filter(b => b.status !== 'cancelled');
    }

    async function getFullSchedule() {
      const today = toISO(new Date());
      const q = query(
        collection(db, 'bookings'),
        where('date', '>=', today),
        orderBy('date'),
        orderBy('time'),
      );
      const snap = await getDocs(q);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    onAuthStateChanged(auth, async function(user) {
      if (!user || !isCoach(user.email)) {
        window.location.href = 'login.html';
        return;
      }
      const snap = await getDoc(doc(db, 'users', user.uid));
      const name = snap.exists() ? snap.data().name : user.displayName || user.email;
      document.getElementById('welcomeMsg').textContent = 'שלום, ' + name;
      await renderSchedule();
    });

    window.logout = async function() {
      sessionStorage.setItem('justLoggedOut', '1');
      await signOut(auth);
      window.location.href = 'index.html';
    };

    window.showTab = function(t, e) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tnav').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + t).classList.add('active');
      if (e && e.currentTarget) e.currentTarget.classList.add('active');
      if (t === 'clients') renderClients();
      if (t === 'schedule') renderSchedule();
    };

    async function renderSchedule() {
      const container = document.getElementById('scheduleList');
      const bookings = await getFullSchedule();
      if (!bookings.length) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-calendar-times" style="font-size:2rem;color:#555;display:block;margin-bottom:12px"></i>אין אימונים מתוכננים</div>';
        return;
      }

      const byDate = {};
      bookings.forEach(b => {
        if (!byDate[b.date]) byDate[b.date] = [];
        byDate[b.date].push(b);
      });

      container.innerHTML = '';
      Object.keys(byDate).sort().forEach(date => {
        const group = document.createElement('div');
        group.className = 'day-group';
        const heading = document.createElement('h3');
        heading.textContent = date;
        group.appendChild(heading);

        byDate[date].forEach(b => {
          const statusCfg = STATUS_CONFIG[b.status] || { label: b.status, color: '#888' };
          const paymentCfg = PAYMENT_CONFIG[b.paymentStatus || 'unpaid'] || { label: b.paymentStatus, color: '#888' };
          const card = document.createElement('div');
          card.className = 'session-card';
          card.innerHTML =
            '<div class="session-accent" style="background:' + statusCfg.color + '"></div>' +
            '<div class="session-body">' +
              '<div class="session-top">' +
                '<span class="session-client">' + escapeHtml(b.clientName || '') + '</span>' +
                '<span class="pill type-pill' + (b.sessionType === 'group' ? ' group' : '') + '">' + (b.sessionType === 'group' ? 'קבוצתי' : 'פרטי') + '</span>' +
              '</div>' +
              '<div class="session-meta">' + escapeHtml(b.time || '') + ' &middot; ' + (b.duration || '') + ' דק\'</div>' +
              (b.location ? '<div class="session-location"><i class="fas fa-location-dot"></i> ' + escapeHtml(b.location) + '</div>' : '') +
              '<div class="badges">' +
                '<span class="pill" style="border-color:' + statusCfg.color + '55;color:' + statusCfg.color + ';background:' + statusCfg.color + '18">' + statusCfg.label + '</span>' +
                '<span class="pill" style="border-color:' + paymentCfg.color + '55;color:' + paymentCfg.color + ';background:' + paymentCfg.color + '18">' + paymentCfg.label + '</span>' +
              '</div>' +
            '</div>';
          group.appendChild(card);
        });

        container.appendChild(group);
      });
    }

    async function renderClients() {
      const clients = await getApprovedClients();
      const container = document.getElementById('clientList');
      if (!clients.length) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash" style="font-size:2rem;color:#555;display:block;margin-bottom:12px"></i>אין לקוחות מאושרים/ות עדיין</div>';
        return;
      }
      container.innerHTML = '';
      for (const c of clients) {
        const upcoming = await getUpcomingBookingsForClient(c.uid || c.id);
        const card = document.createElement('div');
        card.className = 'client-card';
        card.innerHTML =
          '<h4>' + escapeHtml(c.name || c.email) + '</h4>' +
          '<div class="useremail">' + escapeHtml(c.email || '') + '</div>' +
          '<div class="upcoming"><i class="fas fa-calendar-check"></i> ' + upcoming.length + ' אימונים קרובים</div>';
        container.appendChild(card);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
