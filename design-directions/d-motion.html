<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KJ Fitness — Empowered Through Movement</title>
<!-- Direction D · Athletic Motion — Secular One (display) + Noto Sans / Noto Sans Hebrew (text) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --t50:#EEF9FA; --t100:#D6F0F2; --t500:#26B4C0; --t700:#177A83; --t950:#0A3236; --w:#FFFFFF;
  --g50:#F3F5F5; --g600:#5B6668;
  --d:'Secular One', 'Noto Sans Hebrew', sans-serif;
  --f:'Noto Sans', 'Noto Sans Hebrew', system-ui, sans-serif;
  --wrap:1280px; --gut:clamp(16px,4vw,56px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f);font-size:1.0625rem;line-height:1.65;color:var(--t950);background:var(--w);overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul,ol{list-style:none}
.ltr{direction:ltr;unicode-bidi:isolate}
.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
.i-arr{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
[dir=rtl] .i-arr,[dir=rtl] .flip{transform:scaleX(-1)}
:focus-visible{outline:3px solid var(--t950);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--gut);position:relative}
h1,h2,h3{font-family:var(--d);font-weight:400;line-height:1;letter-spacing:-.01em}
[lang=he] h1,[lang=he] h2,[lang=he] h3{letter-spacing:0;line-height:1.08}
h2{font-size:clamp(2.4rem,5.4vw,4.6rem)}
.tag{display:inline-flex;align-items:center;gap:10px;font-family:var(--d);font-size:1.0625rem;color:var(--t700);margin-bottom:16px}
.tag::before{content:"";width:22px;height:10px;background:var(--t500);transform:skewX(-24deg)}
[dir=rtl] .tag::before{transform:skewX(24deg)}
.on-teal .tag{color:var(--t950)}
.on-teal .tag::before,.on-ink .tag::before{background:var(--w)}
.on-ink .tag{color:var(--t500)}

/* slanted buttons: the fill leans like the K leg; mirrors in Hebrew */
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:14px 32px;font-family:var(--d);font-size:1.125rem;text-decoration:none;white-space:nowrap;transition:transform .15s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-12deg);border-radius:4px;transition:box-shadow .15s,background .15s}
[dir=rtl] .btn::before{transform:skewX(12deg)}
.btn-teal{color:var(--t950)}
.btn-teal::before{background:var(--t500);box-shadow:5px 5px 0 var(--t950)}
[dir=rtl] .btn-teal::before{box-shadow:-5px 5px 0 var(--t950)}
.btn-teal:hover{transform:translateY(-2px)}
.btn-white{color:var(--t950)}
.btn-white::before{background:var(--w);box-shadow:5px 5px 0 var(--t950)}
[dir=rtl] .btn-white::before{box-shadow:-5px 5px 0 var(--t950)}
.btn-ink{color:var(--w)}
.btn-ink::before{background:var(--t950)}
.btn-ink:hover::before{background:#0E474C}
.btn-line{color:var(--t950)}
.btn-line::before{border:2px solid var(--t950);background:var(--w)}
.btn-line:hover::before{background:var(--w)}
.btn-xl{min-height:66px;padding:18px 42px;font-size:1.3rem}
.btn .ic-wa{width:1.35em;height:1.35em}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:box-shadow .2s}
.hdr.scrolled{box-shadow:0 1px 0 var(--t100),0 12px 30px -24px rgba(10,50,54,.5)}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:78px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--d);font-size:1.3rem}
.brand img{width:44px;height:44px}
.nav{display:flex;gap:26px;margin-inline-start:auto}
.nav a{text-decoration:none;font-weight:500;font-size:.96875rem;position:relative;padding:6px 0}
.nav a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--t500);transform:skewX(-24deg) scaleX(0);transform-origin:left;transition:transform .2s}
[dir=rtl] .nav a::after{transform-origin:right}
.nav a:hover::after{transform:skewX(-24deg) scaleX(1)}
.acts{display:flex;align-items:center;gap:16px}
.lang{display:flex;background:var(--g50);border-radius:999px;padding:4px}
.lang button{min-width:42px;height:34px;border-radius:999px;font-weight:700;font-size:.875rem;color:var(--g600)}
.lang button[aria-pressed=true]{background:var(--t950);color:var(--w)}
.login{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:500;font-size:.96875rem}
.hdr .btn{min-height:46px;padding:10px 22px;font-size:1rem}
.burger{display:none;width:46px;height:46px;position:relative}
.burger::before{content:"";position:absolute;inset:0;background:var(--t950);transform:skewX(-12deg);border-radius:4px}
[dir=rtl] .burger::before{transform:skewX(12deg)}
.burger i,.burger i::before,.burger i::after{position:absolute;inset-inline-start:13px;width:20px;height:2.5px;background:var(--w);border-radius:2px;transition:transform .2s,background .2s}
.burger i{top:22px}
.burger i::before,.burger i::after{content:"";inset-inline-start:0}
.burger i::before{top:-7px;width:14px}.burger i::after{top:7px}
.menu-open .burger i{background:transparent}
.menu-open .burger i::before{transform:translateY(7px) rotate(45deg);width:20px}
.menu-open .burger i::after{transform:translateY(-7px) rotate(-45deg)}

.menu{position:fixed;inset:66px 0 0 0;z-index:49;background:var(--t950);color:var(--w);padding:28px var(--gut) 110px;display:flex;flex-direction:column;gap:22px;overflow:auto;clip-path:polygon(0 0,0 0,0 100%,0 100%);transition:clip-path .45s cubic-bezier(.7,0,.2,1);visibility:hidden}
[dir=rtl] .menu{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}
.menu-open .menu{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);visibility:visible}
.menu .stripe{position:absolute;inset-block:0;inset-inline-end:-60px;width:160px;background:var(--t500);transform:skewX(-14deg);opacity:.9;pointer-events:none}
[dir=rtl] .menu .stripe{transform:skewX(14deg)}
.menu nav{display:flex;flex-direction:column;position:relative}
.menu nav a{display:flex;align-items:baseline;gap:14px;font-family:var(--d);font-size:2.3rem;line-height:1.15;text-decoration:none;padding:8px 0}
.menu nav a small{font-family:var(--f);font-size:.875rem;font-weight:700;color:var(--t500)}
.menu .btn{align-self:flex-start;position:relative}
.menu .login{color:var(--w);position:relative}

/* mobile sticky WhatsApp bar */
.sticky{display:none}

/* hero */
.hero{position:relative;overflow:hidden;padding:clamp(48px,7vw,104px) 0 clamp(96px,11vw,170px);background:var(--w)}
.hero .sweep{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
[dir=rtl] .hero .sweep{transform:scaleX(-1)}
.sweep .stroke{stroke-dasharray:2600;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.6,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:2600}}
.hero-in{max-width:760px;position:relative}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--t950);color:var(--w);font-weight:500;font-size:.9375rem;padding:6px 16px 6px 12px;border-radius:999px;margin-bottom:26px}
[dir=rtl] .chip{padding:6px 12px 6px 16px}
.chip .ic{color:var(--t500)}
.hero h1{font-size:clamp(3.4rem,8.6vw,8.4rem);line-height:.92;margin-bottom:30px}
[lang=he] .hero h1{line-height:1}
.hero h1 span{display:block}
.hero h1 .l2{padding-inline-start:.5em}
.hero-mission{font-size:clamp(1.125rem,1.7vw,1.35rem);font-weight:500;max-width:28em;margin-bottom:38px;background:rgba(255,255,255,.88);box-shadow:0 0 0 10px rgba(255,255,255,.88);border-radius:2px}
.ctas{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:center}

/* marquee */
.band{background:var(--t950);color:var(--w);overflow:hidden;padding:18px 0;position:relative;z-index:2;margin-top:-1px}
.band-track{display:flex;gap:48px;width:max-content;animation:slide 32s linear infinite}
[dir=rtl] .band-track{animation-name:slide-rtl}
.band span{font-family:var(--d);font-size:clamp(1.4rem,2.4vw,2rem);white-space:nowrap;display:flex;align-items:center;gap:48px}
.band span::after{content:"";width:28px;height:12px;background:var(--t500);transform:skewX(-24deg)}
@keyframes slide{to{transform:translateX(-50%)}}
@keyframes slide-rtl{to{transform:translateX(50%)}}

/* curve divider: the K→J sweep as a section edge */
.edge{display:block;width:100%;height:clamp(60px,9vw,140px)}
[dir=rtl] .edge{transform:scaleX(-1)}

/* about */
.about{overflow:hidden;background:var(--t50);padding:clamp(72px,9vw,130px) 0 clamp(40px,5vw,70px)}
.about .wrap{display:grid;grid-template-columns:5fr 6fr;gap:clamp(40px,6vw,96px);align-items:center}
.slant{position:relative}
.slant img{width:100%;aspect-ratio:5/6;height:auto;object-fit:cover;object-position:55% 25%;clip-path:polygon(22% 0,100% 0,100% 100%,0 100%)}
[dir=rtl] .slant img{clip-path:polygon(0 0,78% 0,100% 100%,0 100%)}
.slant::before{content:"";position:absolute;inset:8% -5% -5% 12%;background:var(--t500);clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);z-index:0}
[dir=rtl] .slant::before{inset:8% 12% -5% -5%;clip-path:polygon(0 0,78% 0,100% 100%,0 100%)}
.slant img{position:relative;z-index:1}
.about h2{margin-bottom:26px}
.about p{margin-bottom:16px;max-width:36em}
.closing{font-family:var(--d);font-size:clamp(1.6rem,2.8vw,2.4rem);line-height:1.15;margin-top:30px!important;position:relative;display:inline;background:linear-gradient(transparent 62%,var(--t100) 62%)}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
.facts li{background:var(--w);border-inline-start:5px solid var(--t500);padding:10px 16px;font-size:.9375rem}
.facts b{font-family:var(--d);font-weight:400;font-size:1.125rem;margin-inline-end:6px}

/* approach */
.approach{background:var(--t500);padding:clamp(40px,5vw,72px) 0 clamp(80px,10vw,140px)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px 56px;margin-bottom:clamp(40px,5vw,64px)}
.head p{max-width:30em;font-size:1.125rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:end}
.steps li{background:var(--w);padding:26px 24px 28px;border-radius:4px;position:relative;box-shadow:8px 8px 0 var(--t950)}
[dir=rtl] .steps li{box-shadow:-8px 8px 0 var(--t950)}
.steps li:nth-child(1){margin-bottom:0}
.steps li:nth-child(2){margin-bottom:36px}
.steps li:nth-child(3){margin-bottom:72px}
.steps li:nth-child(4){margin-bottom:108px}
.steps .n{font-family:var(--d);font-size:3.2rem;line-height:1;color:var(--t700);display:block;margin-bottom:18px}
.steps h3{font-size:1.7rem;margin-bottom:10px}
.steps p{color:var(--g600);font-size:.96875rem}

/* events */
.events{padding:clamp(72px,9vw,130px) 0}
.sample{display:inline-flex;gap:8px;align-items:center;font-size:.875rem;font-weight:500;color:var(--g600);border:1.5px dashed var(--g600);border-radius:999px;padding:4px 12px;margin-top:10px}
.tickets{display:grid;gap:20px}
.ticket{display:grid;grid-template-columns:200px 1fr auto;align-items:stretch;background:var(--g50);border-radius:6px;overflow:hidden}
.ticket .when{background:var(--t950);color:var(--w);padding:22px 44px 22px 24px;clip-path:polygon(0 0,100% 0,82% 100%,0 100%);display:flex;flex-direction:column;justify-content:center}
[dir=rtl] .ticket .when{padding:22px 24px 22px 44px;clip-path:polygon(0 0,100% 0,100% 100%,18% 100%)}
.ticket .when b{font-family:var(--d);font-weight:400;font-size:3.4rem;line-height:.9;color:var(--t500)}
.ticket .when span{font-family:var(--d);font-size:1.25rem}
.ticket .body{padding:22px 12px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.ticket h3{font-size:1.6rem;line-height:1.1}
.ticket .meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.9375rem;color:var(--g600)}
.ticket .meta > span{display:inline-flex;gap:6px;align-items:center}
.ticket .meta .ic{color:var(--t700)}
.ticket .end{padding:22px 28px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:10px}
.ticket .price{font-family:var(--d);font-size:2rem;line-height:1}
.ticket .end a{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--t700);text-decoration:none;white-space:nowrap}
.ticket .end a:hover .i-arr{transform:translateX(3px)}
[dir=rtl] .ticket .end a:hover .i-arr{transform:scaleX(-1) translateX(3px)}
.ev-empty{display:none;position:relative;overflow:hidden;background:var(--t50);border-radius:6px;padding:clamp(28px,5vw,64px);min-height:300px}
.ev-empty svg.bg{position:absolute;inset-block:-10%;inset-inline-end:-4%;height:130%;width:auto}
[dir=rtl] .ev-empty svg.bg{transform:scaleX(-1)}
.ev-empty .in{position:relative;max-width:34em}
.ev-empty h3{font-size:clamp(2rem,3.6vw,3rem);margin-bottom:12px}
.ev-empty p{margin-bottom:28px}
#events[data-state=empty] .tickets,#events[data-state=empty] .sample{display:none}
#events[data-state=empty] .ev-empty{display:block}

/* quote */
.quote{background:var(--t950);color:var(--w);position:relative;overflow:hidden;padding:clamp(90px,11vw,160px) 0}
.quote svg{position:absolute;inset-block:-20% -30%;inset-inline-end:-9%;height:150%;width:auto;opacity:.95}
[dir=rtl] .quote svg{transform:scaleX(-1)}
.quote blockquote{position:relative;max-width:min(760px,58%)}
.quote p{font-family:var(--d);font-size:clamp(1.9rem,4vw,3.4rem);line-height:1.15}
.quote footer{margin-top:30px;display:flex;align-items:center;gap:14px;font-size:1.0625rem}
.quote footer b{font-family:var(--d);font-weight:400;color:var(--t500);font-size:1.3rem}
.quote footer span{color:var(--t100)}

/* services: comparison */
.services{padding:clamp(72px,9vw,130px) 0}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:0 20px;grid-template-rows:repeat(6,auto)}
.plan{grid-row:span 6;display:grid;grid-template-rows:subgrid;background:var(--g50);border-radius:6px;padding:28px;gap:18px;position:relative}
.plan.hot{background:var(--t950);color:var(--w)}
.plan .badge{position:absolute;top:-14px;inset-inline-start:24px;font-family:var(--d);font-size:.9375rem;padding:4px 16px;color:var(--t950)}
.plan .badge::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--t500);transform:skewX(-12deg)}
[dir=rtl] .plan .badge::before{transform:skewX(12deg)}
.plan .badge{isolation:isolate}
.plan .kind{font-size:.9375rem;font-weight:500;color:var(--g600)}
.plan.hot .kind{color:var(--t100)}
.plan h3{font-size:2rem;margin-top:4px}
.plan .price{font-family:var(--d);line-height:1}
.plan .price b{font-weight:400;font-size:3.2rem}
.plan .price small{font-family:var(--f);font-size:.9375rem;color:var(--g600)}
.plan.hot .price b{color:var(--t500)}
.plan.hot .price small{color:var(--t100)}
.plan .rates{display:grid;gap:6px;font-size:.9375rem}
.plan .rates li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #DCE3E3;padding-bottom:6px}
.plan .rates b{font-family:var(--d);font-weight:400;font-size:1.15rem;white-space:nowrap}
.plan > p{font-size:.96875rem;color:var(--g600)}
.plan.hot > p{color:var(--t100)}
.plan .row{border-top:2px solid var(--t950);padding-top:12px}
.plan.hot .row{border-color:var(--t500)}
.plan .row small{display:block;font-size:.8125rem;font-weight:700;color:var(--t700);margin-bottom:2px}
.plan.hot .row small{color:var(--t500)}
.plan .row b{font-weight:500}
.plan .feat{display:grid;gap:8px;font-size:.96875rem;align-content:start}
.plan .feat li{display:flex;gap:10px;align-items:flex-start}
.plan .feat .ic{color:var(--t700);margin-top:.2em}
.plan.hot .feat .ic{color:var(--t500)}
.plan .btn{justify-self:start;align-self:end}
.more{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
.wide{border-radius:6px;padding:clamp(24px,3vw,40px);display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;overflow:hidden;position:relative}
.wide.teal{background:var(--t500)}
.wide.ink{background:var(--t950);color:var(--w)}
.wide h3{font-size:clamp(1.9rem,2.8vw,2.5rem);margin-bottom:8px}
.wide .price{font-family:var(--d);font-size:2.4rem;line-height:1;margin-bottom:14px}
.wide .price small{font-family:var(--f);font-size:.9375rem}
.wide .feat{display:grid;gap:6px;margin:14px 0 22px;font-size:.96875rem}
.wide .feat li{display:flex;gap:10px}
.wide .feat li::before{content:"";width:14px;height:6px;margin-top:.65em;flex:none;background:currentColor;transform:skewX(-24deg)}
.ph{border:2px dashed currentColor;border-radius:4px;display:grid;place-items:center;text-align:center;padding:16px;font-weight:700;font-size:.875rem;line-height:1.4;min-height:220px;height:100%;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.25) 0 12px,transparent 12px 24px)}
.wide.ink .ph{color:var(--t100);background:repeating-linear-gradient(-45deg,rgba(38,180,192,.12) 0 12px,transparent 12px 24px)}

/* contact */
.contact{background:var(--t500);padding:clamp(24px,4vw,56px) 0 clamp(80px,10vw,130px)}
.contact .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(40px,6vw,96px);align-items:center}
.contact h2{font-size:clamp(3rem,7.4vw,6.6rem);line-height:.95;margin-bottom:22px}
.contact .lead{font-size:1.1875rem;font-weight:500;max-width:28em;margin-bottom:38px}
.chan{display:grid;gap:12px}
.chan a{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;background:var(--w);border-radius:6px;padding:14px 20px 14px 14px;text-decoration:none;transition:transform .15s}
[dir=rtl] .chan a{padding:14px 14px 14px 20px}
.chan a:hover{transform:translateX(6px)}
[dir=rtl] .chan a:hover{transform:translateX(-6px)}
.chan .icb{width:52px;height:52px;background:var(--t950);color:var(--t500);display:grid;place-items:center;border-radius:4px}
.chan .icb .ic{width:24px;height:24px}
.chan b{font-family:var(--d);font-weight:400;font-size:1.3rem;display:block;line-height:1.2}
.chan a > span > span{display:block;font-size:.9375rem;color:var(--g600)}

.foot{background:var(--t950);color:var(--w);padding:48px 0 28px}
.foot .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:24px 40px;align-items:center}
.foot .tagline{font-family:var(--d);font-size:1.6rem;color:var(--t500)}
.social{display:flex;gap:10px}
.social a{width:46px;height:46px;display:grid;place-items:center;position:relative;isolation:isolate;color:var(--t950)}
.social a::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--t500);transform:skewX(-12deg);border-radius:3px}
[dir=rtl] .social a::before{transform:skewX(12deg)}
.social a:hover::before{background:var(--w)}
.social .ic{width:20px;height:20px}
.copy{grid-column:1/-1;border-top:1px solid #1B4D52;padding-top:20px;font-size:.875rem;color:var(--t100)}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,50,54,.6);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-box{background:var(--w);width:min(600px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:8px;position:relative;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(16px);opacity:0}}
.modal-head{background:var(--t500);padding:30px 32px 56px;clip-path:polygon(0 0,100% 0,100% 62%,0 100%)}
[dir=rtl] .modal-head{clip-path:polygon(0 0,100% 0,100% 100%,0 62%)}
.modal-head .tag{color:var(--t950);margin-bottom:10px}
.modal-head .tag::before{background:var(--w)}
.modal-head h2{font-size:clamp(2rem,4.4vw,2.8rem);padding-inline-end:48px}
.modal-x{position:absolute;inset-block-start:16px;inset-inline-end:16px;width:44px;height:44px;border-radius:50%;background:var(--t950);color:var(--w);display:grid;place-items:center}
.modal-x .ic{width:20px;height:20px}
.modal-sub{padding:0 32px;margin:-14px 0 18px;font-weight:500}
.opts{display:grid;gap:8px;padding:0 32px}
.consult-opt{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;background:var(--g50);border-radius:6px;padding:10px 18px 10px 10px;text-decoration:none;font-weight:700;font-size:1.0625rem;border-inline-start:5px solid transparent;transition:border-color .15s,background .15s}
[dir=rtl] .consult-opt{padding:10px 10px 10px 18px}
.consult-opt .icb{width:48px;height:48px;border-radius:4px;background:var(--w);display:grid;place-items:center;color:var(--t700)}
.consult-opt .icb .ic{width:22px;height:22px}
.consult-opt .i-arr{color:var(--t700)}
.consult-opt:hover{border-color:var(--t500);background:var(--t50)}
.modal-foot{display:flex;align-items:center;gap:8px;padding:18px 32px 28px;font-size:.875rem;color:var(--g600)}
.modal-foot .ic{color:var(--t700)}
body.modal-open,body.menu-open{overflow:hidden}

.proto{position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:60;background:var(--t950);color:var(--w);border-radius:999px;padding:5px;display:flex;gap:4px;align-items:center;font-size:.8125rem;font-weight:500}
.proto > span{padding-inline:10px}
.proto button{border-radius:999px;padding:4px 10px;color:var(--t100)}
.proto button[aria-pressed=true]{background:var(--t500);color:var(--t950)}
.shot .proto{display:none}
.shot *,.shot *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

@media (max-width:1160px){
  .nav{display:none}
  .burger{display:block}
  .acts{margin-inline-start:auto}
  .steps{grid-template-columns:1fr 1fr;align-items:start}
  .steps li:nth-child(n){margin-bottom:0}
  .steps li:nth-child(even){margin-top:36px}
  .cmp{grid-template-columns:1fr;grid-template-rows:none;gap:28px}
  .plan{grid-row:auto;grid-template-rows:none}
  .more{grid-template-columns:1fr}
}
@media (max-width:860px){
  .about .wrap,.contact .wrap{grid-template-columns:1fr}
  .slant{max-width:460px}
  .ticket{grid-template-columns:130px 1fr}
  .ticket .end{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;border-top:1px solid #DCE3E3;padding:14px 20px}
  .foot .wrap{grid-template-columns:1fr}
  .quote{padding-bottom:230px}
  .quote blockquote{max-width:none}
  .quote svg{inset-block:auto -60px;inset-inline-end:-12%;height:300px}
}
@media (max-width:640px){
  .hdr .wrap{height:66px;gap:10px}
  .brand span,.hdr .login,.hdr .btn{display:none}
  .acts{gap:10px}
  .hero{padding:36px 0 190px}
  .hero .sweep{inset:auto 0 0 auto;height:auto;width:100%}
  .hero h1 .l2{padding:0}
  .hero-mission{box-shadow:none;background:none}
  .ctas .btn{width:calc(100% - 12px)}
  .steps{grid-template-columns:1fr}
  .steps li:nth-child(even){margin-top:0}
  .wide{grid-template-columns:1fr}
  .wide .ph{min-height:160px;order:-1}
  .ticket{grid-template-columns:96px 1fr}
  .ticket .when{padding:16px 26px 16px 14px}

  .ticket .when b{font-size:2.4rem}
  .ticket h3{font-size:1.3rem}
  .contact .btn{width:calc(100% - 12px)}
  .sticky{display:flex;position:fixed;inset:auto 0 0 0;z-index:55;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(255,255,255,.95) 30%)}
  .sticky .btn{width:100%;min-height:56px}
  .foot{padding-bottom:100px}
  .modal{place-items:end center;padding:0}
  .modal-box{width:100%;border-radius:16px 16px 0 0;max-height:92dvh;animation:sheet .3s ease-out}
  @keyframes sheet{from{transform:translateY(100%)}}
  .modal-head{padding:24px 20px 48px}
  .modal-sub,.opts{padding-inline:20px}
  .modal-foot{padding:16px 20px 24px}
  .proto{inset-block-end:90px}
}
</style>
