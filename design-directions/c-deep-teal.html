<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KJ Fitness — Empowered Through Movement</title>
<!-- Direction C · Deep Teal Premium — Heebo (Latin + Hebrew, one family; light display weights) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --t200:#ADE1E6; --t500:#26B4C0; --t800:#135F66; --t900:#0E474C; --t950:#0A3236; --t975:#062629;
  --bone:#F4F0EA; --bone2:#DCD5CA;
  --f:'Heebo', system-ui, sans-serif;
  --wrap:1280px; --gut:clamp(16px,4vw,56px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f);font-weight:400;font-size:1.0625rem;line-height:1.7;color:var(--bone);background:var(--t975);overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul,ol{list-style:none}
.ltr{direction:ltr;unicode-bidi:isolate}
.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
.i-arr{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
[dir=rtl] .i-arr{transform:scaleX(-1)}
:focus-visible{outline:2px solid var(--t500);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--gut)}
.muted{color:var(--t200)}
h1,h2,h3{font-weight:200;line-height:1.05;letter-spacing:-.02em}
[lang=he] h1,[lang=he] h2,[lang=he] h3{letter-spacing:0;font-weight:300;line-height:1.12}
h2{font-size:clamp(2.4rem,5vw,4.4rem)}
.label{display:flex;align-items:center;gap:14px;font-weight:500;font-size:.9375rem;color:var(--t500);margin-bottom:22px}
.label::before{content:"";width:36px;height:1px;background:var(--t500)}
.hi{color:var(--t500)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:14px 30px;border-radius:999px;font-weight:500;font-size:1.0625rem;text-decoration:none;transition:background .2s,color .2s,box-shadow .25s,transform .2s;white-space:nowrap}
.btn-teal{background:var(--t500);color:var(--t975);font-weight:700}
.btn-teal:hover{background:#4EC1CB;box-shadow:0 0 0 6px rgba(38,180,192,.18);transform:translateY(-1px)}
.btn-ghost{border:1px solid rgba(244,240,234,.35);color:var(--bone)}
.btn-ghost:hover{border-color:var(--bone);background:rgba(244,240,234,.06)}
.btn-lg{min-height:62px;padding:18px 40px;font-size:1.125rem}
.btn .ic-wa{width:1.35em;height:1.35em}

/* header */
.hdr{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.hdr.scrolled{background:rgba(6,38,41,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--t900)}
.hdr .wrap{display:flex;align-items:center;gap:32px;height:84px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:500;letter-spacing:.02em}
[lang=he] .brand{letter-spacing:0}
.brand img{width:40px;height:40px;border-radius:4px}
.nav{display:flex;gap:30px;margin-inline-start:auto}
.nav a{text-decoration:none;font-size:.96875rem;color:var(--bone2);position:relative;padding:6px 0}
.nav a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--t500);transform:scaleX(0);transition:transform .25s}
.nav a:hover{color:var(--bone)}
.nav a:hover::after{transform:none}
.acts{display:flex;align-items:center;gap:20px}
.lang{display:flex;align-items:center;gap:2px;font-size:.9375rem}
.lang button{padding:6px 8px;color:var(--t200);border-bottom:1px solid transparent}
.lang button[aria-pressed=true]{color:var(--bone);border-color:var(--t500);font-weight:500}
.lang .sep{width:1px;height:14px;background:var(--t800)}
.login{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:.96875rem;color:var(--bone2)}
.login:hover{color:var(--bone)}
.hdr .btn{min-height:44px;padding:10px 22px;font-size:.96875rem}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--t800);position:relative}
.burger i,.burger i::after{position:absolute;inset-inline-start:13px;height:1.5px;background:var(--bone);transition:transform .25s,width .25s}
.burger i{top:18px;width:18px}
.burger i::after{content:"";inset-inline-start:0;top:6px;width:12px}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,20,22,.6);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.menu{position:fixed;inset-block:0;inset-inline-end:0;width:min(420px,88vw);z-index:61;background:var(--t950);border-inline-start:1px solid var(--t900);padding:24px 28px 32px;display:flex;flex-direction:column;gap:28px;transform:translateX(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),visibility .35s;overflow:auto}
[dir=rtl] .menu{transform:translateX(-100%)}
.menu-open .menu{transform:none;visibility:visible}
.menu-open .scrim{opacity:1;visibility:visible}
.menu-top{display:flex;justify-content:space-between;align-items:center}
.menu-x{width:44px;height:44px;border-radius:50%;border:1px solid var(--t800);display:grid;place-items:center}
.menu-x .ic{width:20px;height:20px}
.menu nav{display:flex;flex-direction:column}
.menu nav a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;font-weight:300;font-size:1.9rem;line-height:1.2;padding:14px 0;border-bottom:1px solid var(--t900)}
.menu nav a .i-arr{color:var(--t500)}
.menu .btn{width:100%}
.menu-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--t200);font-size:.9375rem}

/* hero */
.hero{position:relative;min-height:min(100vh,980px);display:flex;align-items:center;padding:140px 0 72px;overflow:hidden;background:radial-gradient(80% 70% at 85% 40%,#0B3A3E 0%,var(--t975) 65%)}
[dir=rtl] .hero{background:radial-gradient(80% 70% at 15% 40%,#0B3A3E 0%,var(--t975) 65%)}
.hero .sweep{position:absolute;inset-block-start:2%;inset-inline-end:-4%;height:112%;width:auto;pointer-events:none}
[dir=rtl] .hero .sweep{transform:scaleX(-1)}
.hero .wrap{position:relative;width:100%}
.hero-inner{max-width:720px}
.hero h1{font-size:clamp(3.3rem,8vw,7.4rem);font-weight:200;line-height:1;margin-bottom:34px}
[lang=he] .hero h1{font-weight:300;line-height:1.08}
.hero h1 span{display:block}
.hero h1 .hi{font-weight:300}
.hero-mission{font-size:clamp(1.125rem,1.6vw,1.3rem);font-weight:300;color:var(--t200);max-width:31em;margin-bottom:42px}
.ctas{display:flex;flex-wrap:wrap;gap:14px}
.hero-facts{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:0;margin-top:clamp(56px,8vw,110px);border-top:1px solid var(--t900)}
.hero-facts li{padding:18px 40px 0 0;margin-inline-end:40px;border-inline-end:1px solid var(--t900)}
[dir=rtl] .hero-facts li{padding:18px 0 0 40px}
.hero-facts li:last-child{border:0;margin:0}
.hero-facts b{display:block;font-weight:500;font-size:1.0625rem}
.hero-facts li > span{font-size:.9375rem;color:var(--t200)}

/* about */
.about{overflow:hidden;background:var(--t950);padding:clamp(80px,10vw,150px) 0}
.about .wrap{display:grid;grid-template-columns:5fr 6fr;gap:clamp(40px,7vw,110px);align-items:center}
.jmask{position:relative}
.jmask img{width:100%;aspect-ratio:4/5;height:auto;object-fit:cover;object-position:50% 25%;border-start-start-radius:6px;border-start-end-radius:6px;border-end-start-radius:6px;border-end-end-radius:58% 36%;filter:saturate(.9)}
.jmask::after{content:"";position:absolute;inset:18px -18px -18px 18px;border:1px solid var(--t500);border-start-start-radius:6px;border-start-end-radius:6px;border-end-start-radius:6px;border-end-end-radius:58% 36%;z-index:-1}
[dir=rtl] .jmask::after{inset:18px 18px -18px -18px}
.jmask{isolation:isolate}
.about h2{margin-bottom:30px}
.about p{margin-bottom:18px;color:var(--bone2);font-weight:300;font-size:1.125rem}
.about .closing{font-size:clamp(1.5rem,2.6vw,2.2rem);line-height:1.3;font-weight:300;color:var(--t500);margin:36px 0 0}
.about-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.chip{border:1px solid var(--t800);border-radius:999px;padding:8px 16px;font-size:.9375rem;color:var(--bone2)}
.chip b{color:var(--bone);font-weight:500}

/* approach */
.approach{padding:clamp(80px,10vw,150px) 0}
.head{display:grid;grid-template-columns:1fr 1fr;gap:24px 72px;align-items:end;margin-bottom:clamp(48px,6vw,80px)}
.head p{color:var(--t200);font-weight:300;font-size:1.125rem;max-width:32em}
.pillars{display:grid;grid-template-columns:repeat(4,1fr)}
.pillars li{padding:8px 32px 8px;border-inline-start:1px solid var(--t900)}
.pillars li:first-child{border:0;padding-inline-start:0}
.pillars .n{display:block;font-size:4rem;font-weight:200;line-height:1;color:var(--t500);margin-bottom:28px}
.pillars h3{font-size:1.6rem;font-weight:300;margin-bottom:12px}
.pillars p{color:var(--t200);font-weight:300;font-size:1rem}

/* events */
.events{background:var(--t950);padding:clamp(80px,10vw,140px) 0}
.sample{display:inline-flex;align-items:center;gap:8px;font-size:.875rem;color:var(--t200);border:1px dashed var(--t800);border-radius:999px;padding:4px 12px;margin-top:14px}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ev{background:var(--t900);border-radius:18px;padding:30px;display:flex;flex-direction:column;gap:16px;border:1px solid rgba(173,225,230,.08);transition:border-color .25s,transform .25s}
.ev:hover{border-color:rgba(38,180,192,.5);transform:translateY(-2px)}
.ev-when{display:flex;align-items:center;gap:18px}
.ev-when .d{font-size:3.4rem;font-weight:200;line-height:1;color:var(--t500)}
.ev-when .m{font-size:.9375rem;color:var(--t200);line-height:1.4}
.ev-when .m b{display:block;color:var(--bone);font-weight:500}
.ev h3{font-size:1.6rem;font-weight:300;line-height:1.2}
.ev-loc{display:flex;align-items:center;gap:8px;color:var(--t200);font-size:.9375rem}
.ev-d{color:var(--bone2);font-weight:300;font-size:1rem}
.ev-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:16px;border-top:1px solid var(--t800)}
.ev-price{font-size:1.5rem;font-weight:300}
.ev-foot a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--bone);font-weight:500}
.ev-foot a .i-arr{color:var(--t500)}
.ev-empty{display:none;text-align:center;border:1px solid var(--t900);border-radius:24px;padding:clamp(40px,6vw,72px) 24px;background:radial-gradient(60% 80% at 50% 0%,rgba(38,180,192,.10),transparent 70%)}
.ring{width:84px;height:84px;margin:0 auto 24px;border-radius:50%;border:1px solid var(--t500);display:grid;place-items:center;color:var(--t500);position:relative}
.ring::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--t900)}
.ring .ic{width:32px;height:32px}
.ev-empty h3{font-size:clamp(1.9rem,3.4vw,2.8rem);margin-bottom:12px}
.ev-empty p{color:var(--t200);font-weight:300;max-width:34em;margin:0 auto 30px}
#events[data-state=empty] .ev-grid,#events[data-state=empty] .sample{display:none}
#events[data-state=empty] .ev-empty{display:block}

/* quote */
.quote{position:relative;padding:clamp(96px,12vw,180px) 0;text-align:center;overflow:hidden}
.quote .sweep-line{position:absolute;inset-block-start:-10%;inset-inline-start:-8%;height:130%;opacity:.9}
[dir=rtl] .quote .sweep-line{transform:scaleX(-1)}
.quote .wrap{position:relative;max-width:1000px}
.quote p{font-size:clamp(1.8rem,3.8vw,3.2rem);font-weight:200;line-height:1.28}
[lang=he] .quote p{font-weight:300}
.quote footer{margin-top:36px;display:flex;justify-content:center;align-items:center;gap:14px;color:var(--t200)}
.quote footer b{color:var(--t500);font-weight:500}
.quote footer::before,.quote footer::after{content:"";width:32px;height:1px;background:var(--t800)}

/* services (tabs) */
.services{background:var(--t950);padding:clamp(80px,10vw,150px) 0}
.tabs{display:grid;grid-template-columns:minmax(260px,4fr) 7fr;gap:clamp(24px,4vw,56px);align-items:start}
.tablist{display:flex;flex-direction:column;border-top:1px solid var(--t900)}
.tab{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;text-align:start;padding:20px 18px;border-bottom:1px solid var(--t900);position:relative;transition:background .2s}
.tab::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:2px;background:var(--t500);transform:scaleY(0);transition:transform .25s}
.tab b{font-weight:300;font-size:1.35rem;line-height:1.2}
.tab small{grid-column:1;font-size:.875rem;color:var(--t200)}
.tab .p{grid-row:1/3;grid-column:2;font-size:.96875rem;color:var(--t200)}
.tab:hover{background:rgba(14,71,76,.5)}
.tab[aria-selected=true]{background:var(--t900)}
.tab[aria-selected=true]::before{transform:none}
.tab[aria-selected=true] b{color:var(--bone);font-weight:400}
.panel{background:var(--t900);border-radius:24px;padding:clamp(28px,4vw,52px);min-height:100%}
.panel-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.panel h3{font-size:clamp(2rem,3.4vw,2.9rem);margin-bottom:6px}
.panel .tag{color:var(--t200);font-size:.9375rem}
.big-price{text-align:end}
.big-price b{display:block;font-size:clamp(2.4rem,4vw,3.6rem);font-weight:200;line-height:1;color:var(--t500)}
.big-price > span{color:var(--t200);font-size:.9375rem}
.panel > p{color:var(--bone2);font-weight:300;font-size:1.125rem;max-width:36em;margin-bottom:26px}
.rates{border-top:1px solid var(--t800);margin-bottom:30px}
.rates li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--t800)}
.rates b{font-weight:300;font-size:1.5rem;color:var(--bone);white-space:nowrap}
.rates small{color:var(--t200);font-size:.875rem;margin-inline-start:6px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;margin-bottom:32px}
.checks li{display:flex;gap:12px;align-items:flex-start;color:var(--bone2);font-weight:300}
.checks .ic{color:var(--t500);margin-top:.25em}
.ph{border:1px dashed var(--t500);border-radius:16px;background:repeating-linear-gradient(-45deg,rgba(38,180,192,.07) 0 12px,transparent 12px 24px);color:var(--t200);font-size:.875rem;font-weight:500;display:grid;place-items:center;text-align:center;padding:16px;aspect-ratio:16/6;margin-bottom:26px}
.tab-ph{display:none}

/* contact */
.contact{position:relative;padding:clamp(96px,12vw,170px) 0;text-align:center;overflow:hidden;background:radial-gradient(70% 60% at 50% 100%,#0B3A3E 0%,var(--t975) 70%)}
.contact h2{font-size:clamp(2.8rem,7vw,6rem);margin-bottom:22px}
.contact .lead{color:var(--t200);font-weight:300;font-size:1.1875rem;max-width:32em;margin:0 auto 42px}
.chan{display:grid;grid-template-columns:repeat(3,1fr);max-width:960px;margin:clamp(56px,7vw,96px) auto 0;border-top:1px solid var(--t900)}
.chan a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 16px 0;text-decoration:none;border-inline-start:1px solid var(--t900)}
.chan a:first-child{border:0}
.chan .ic{width:28px;height:28px;color:var(--t500);margin-bottom:8px}
.chan b{font-weight:400;font-size:1.25rem}
.chan a > span{color:var(--t200);font-size:.9375rem}
.chan a:hover b{color:var(--t500)}

.foot{border-top:1px solid var(--t900);padding:44px 0 28px}
.foot .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:24px 40px;align-items:center}
.foot .tagline{font-weight:200;font-size:1.5rem;color:var(--t200)}
[lang=he] .foot .tagline{font-weight:300}
.social{display:flex;gap:10px}
.social a{width:44px;height:44px;border-radius:50%;border:1px solid var(--t800);display:grid;place-items:center;color:var(--t200);transition:all .2s}
.social a:hover{color:var(--t975);background:var(--t500);border-color:var(--t500)}
.social .ic{width:19px;height:19px}
.copy{grid-column:1/-1;font-size:.875rem;color:var(--t200);padding-top:20px;border-top:1px solid var(--t900)}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,20,22,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-box{background:var(--t950);border:1px solid var(--t900);border-radius:28px;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:clamp(24px,4vw,44px);position:relative;box-shadow:0 40px 100px -30px rgba(0,0,0,.7)}
.modal-x{position:absolute;inset-block-start:18px;inset-inline-end:18px;width:44px;height:44px;border-radius:50%;border:1px solid var(--t800);display:grid;place-items:center;color:var(--t200)}
.modal-x:hover{color:var(--bone);border-color:var(--bone)}
.modal-x .ic{width:20px;height:20px}
.modal h2{font-size:clamp(2rem,4.2vw,2.6rem);margin-bottom:10px;padding-inline-end:48px}
.modal-sub{color:var(--t200);font-weight:300;margin-bottom:26px}
.opts{display:grid;gap:8px}
.consult-opt{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:12px 18px 12px 12px;background:var(--t900);border-radius:14px;text-decoration:none;font-size:1.0625rem;border:1px solid transparent;transition:border-color .2s,background .2s}
[dir=rtl] .consult-opt{padding:12px 12px 12px 18px}
.consult-opt .icb{width:44px;height:44px;border-radius:50%;background:var(--t950);display:grid;place-items:center;color:var(--t500)}
.consult-opt .icb .ic{width:20px;height:20px}
.consult-opt .i-arr{color:var(--t500)}
.consult-opt:hover{border-color:var(--t500)}
.consult-opt:hover .i-arr{transform:translateX(4px)}
[dir=rtl] .consult-opt:hover .i-arr{transform:scaleX(-1) translateX(4px)}
.modal-foot{display:flex;align-items:center;gap:8px;margin-top:20px;color:var(--t200);font-size:.875rem}
.modal-foot .ic{color:var(--t500)}
body.modal-open,body.menu-open{overflow:hidden}

.proto{position:fixed;inset-block-end:16px;inset-inline-start:16px;z-index:70;background:var(--bone);color:var(--t975);border-radius:999px;padding:5px;display:flex;gap:4px;align-items:center;font-size:.8125rem;font-weight:500}
.proto > span{padding-inline:10px}
.proto button{border-radius:999px;padding:4px 10px}
.proto button[aria-pressed=true]{background:var(--t975);color:var(--bone)}
.shot .proto{display:none}

@media (max-width:1140px){
  .nav,.hdr .login{display:none}
  .burger{display:block}
  .acts{margin-inline-start:auto}
}
@media (max-width:960px){
  .about .wrap,.head{grid-template-columns:1fr}
  .jmask{max-width:460px}
  .pillars{grid-template-columns:1fr 1fr;gap:40px 0}
  .pillars li:nth-child(3){border:0;padding-inline-start:0}
  .ev-grid{grid-template-columns:1fr}
  .tabs{grid-template-columns:1fr}
  .tablist{flex-direction:row;overflow-x:auto;gap:8px;border:0;scrollbar-width:none;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);scroll-snap-type:x mandatory}
  .tablist::-webkit-scrollbar{display:none}
  .tab{flex:none;border:1px solid var(--t800);border-radius:999px;padding:10px 18px;grid-template-columns:auto;scroll-snap-align:start}
  .tab::before,.tab small,.tab .p{display:none}
  .tab b{font-size:1rem;white-space:nowrap}
  .tab[aria-selected=true]{background:var(--t500);border-color:var(--t500)}
  .tab[aria-selected=true] b{color:var(--t975);font-weight:500}
  .foot .wrap{grid-template-columns:1fr}
}
@media (max-width:640px){
  .hdr .wrap{height:68px;gap:12px}
  .brand span{display:none}
  .acts{gap:10px}
  .hdr .btn{width:44px;padding:0}
  .hdr .btn span{display:none}
  .hero{padding-top:108px;min-height:0}
